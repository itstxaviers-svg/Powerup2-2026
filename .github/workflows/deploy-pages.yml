name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Build student demo
        run: npm run build:student
        env:
          VITE_BASE_PATH: /Powerup2-2026/
          VITE_YANDEX_API_URL: ${{ secrets.YANDEX_API_URL }}
      - run: mv dist pages-site

      - name: Build teacher demo
        run: npm run build:teacher
        env:
          VITE_BASE_PATH: /Powerup2-2026/teacher/
          VITE_YANDEX_API_URL: ${{ secrets.YANDEX_API_URL }}
      - run: mkdir -p pages-site/teacher && cp -R dist/. pages-site/teacher/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pages-site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
